name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q AppLocker.zip -d src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug
        working-directory: src/AppLocker
      - uses: actions/upload-artifact@v4
        with:
          name: AppLocker-apk
          path: src/AppLocker/app/build/outputs/apk/debug/app-debug.apk
